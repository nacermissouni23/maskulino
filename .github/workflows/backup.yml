name: weekly-db-backup
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Logical dump (schema + data, no Storage bytes)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump -h "${{ secrets.SUPABASE_DB_HOST }}" -p 5432 -U postgres -d postgres \
            --no-owner --no-privileges -F c -f maskulino-$(date +%F).dump
      - name: Keep 90 days as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maskulino-db-${{ github.run_number }}
          path: maskulino-*.dump
          retention-days: 90
