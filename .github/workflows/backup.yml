name: weekly-db-backup
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Logical backup over REST (all tables as JSON)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-rest.mjs
      - name: Keep 90 days as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maskulino-db-${{ github.run_number }}
          path: maskulino-backup-*.json
          retention-days: 90
